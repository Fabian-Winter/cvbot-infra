name: Provision Terraform infrastructure

on:
  push:
    branches: [main]
    paths: [
      "infra/**",
      "docs/*.puml",
      ".github/workflows/**"
    ]
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_project: cvbot
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_gh_owner: ${{ github.repository_owner }}
  TF_VAR_gh_owner_id: ${{ github.repository_owner_id }}
  TF_VAR_gh_repo: ${{ vars.GH_REPO }}
  TF_VAR_gh_pat: ${{ secrets.GH_PAT }}
  # Every webapp_* variable of variables.tf is overridable through a repository
  # variable of the same name in upper case (e.g. WEBAPP_TOP_K). The fallback
  # after || mirrors the default in variables.tf, so an unset repository
  # variable keeps Terraform on its own default.
  # Web application infrastructure.
  TF_VAR_webapp_port: ${{ vars.WEBAPP_PORT || 8080 }}
  TF_VAR_webapp_image_tag: ${{ vars.WEBAPP_IMAGE_TAG || 'latest' }}
  TF_VAR_webapp_task_cpu: ${{ vars.WEBAPP_TASK_CPU || 256 }}
  TF_VAR_webapp_task_memory: ${{ vars.WEBAPP_TASK_MEMORY || 512 }}
  TF_VAR_ecr_image_retention_count: ${{ vars.ECR_IMAGE_RETENTION_COUNT || 3 }}
  TF_VAR_webapp_throttle_rate_limit: ${{ vars.WEBAPP_THROTTLE_RATE_LIMIT || 5 }}
  TF_VAR_webapp_throttle_burst_limit: ${{ vars.WEBAPP_THROTTLE_BURST_LIMIT || 10 }}
  TF_VAR_chroma_collection: ${{ vars.CHROMA_COLLECTION || 'cvbot_documents' }}
  TF_VAR_llm_model_id: ${{ vars.LLM_MODEL_ID || 'eu.anthropic.claude-haiku-4-5-20251001-v1:0' }}
  TF_VAR_webapp_top_k: ${{ vars.WEBAPP_TOP_K || 4 }}
  TF_VAR_webapp_overfetch_factor: ${{ vars.WEBAPP_OVERFETCH_FACTOR || 4 }}
  TF_VAR_webapp_filter_weight: ${{ vars.WEBAPP_FILTER_WEIGHT || 0.2 }}
  TF_VAR_webapp_recency_weight: ${{ vars.WEBAPP_RECENCY_WEIGHT || 0.2 }}
  TF_VAR_webapp_recency_window_years: ${{ vars.WEBAPP_RECENCY_WINDOW_YEARS || 10 }}
  TF_VAR_webapp_max_context_tokens: ${{ vars.WEBAPP_MAX_CONTEXT_TOKENS || 32000 }}
  TF_VAR_webapp_response_token_buffer: ${{ vars.WEBAPP_RESPONSE_TOKEN_BUFFER || 2048 }}
  TF_VAR_webapp_log_level: ${{ vars.WEBAPP_LOG_LEVEL || 'INFO' }}
  TF_VAR_webapp_rate_limit_per_minute: ${{ vars.WEBAPP_RATE_LIMIT_PER_MINUTE || 10 }}
  TF_VAR_webapp_rate_limit_per_hour: ${{ vars.WEBAPP_RATE_LIMIT_PER_HOUR || 60 }}
  TF_VAR_webapp_trust_forwarded_for: ${{ vars.WEBAPP_TRUST_FORWARDED_FOR || 'true' }}
  TF_VAR_webapp_conversation_ttl_seconds: ${{ vars.WEBAPP_CONVERSATION_TTL_SECONDS || 1800 }}
  TF_VAR_webapp_max_conversations: ${{ vars.WEBAPP_MAX_CONVERSATIONS || 50 }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    permissions:
      contents: read
    outputs:
      bucket: ${{ steps.backend.outputs.bucket }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Compute state backend name
        id: backend
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          echo "bucket=${TF_VAR_project}-terraform-state-${account_id}" >> "$GITHUB_OUTPUT"

      - name: Check whether remote state already exists
        id: remote_state
        run: |
          if aws s3api head-bucket --bucket "${{ steps.backend.outputs.bucket }}" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bootstrap with local state (first run, creates all resources incl. the state bucket)
        if: steps.remote_state.outputs.exists == 'false'
        run: |
          # Swaps the s3 backend for local so init/apply don't require the not-yet-existing bucket.
          cat > backend_override.tf <<'EOF'
          terraform {
            backend "local" {}
          }
          EOF
          terraform init
          terraform apply -auto-approve \
            -target=aws_s3_bucket.tf_state \
            -target=aws_s3_bucket_versioning.tf_state \
            -target=aws_s3_bucket_server_side_encryption_configuration.tf_state \
            -target=aws_s3_bucket_public_access_block.tf_state
          rm -f backend_override.tf

      - name: Init against S3 backend (migrates local state on first run)
        run: |
          migrate_flag=""
          if [ "${{ steps.remote_state.outputs.exists }}" = "false" ]; then
            migrate_flag="-migrate-state -force-copy"
          fi
          terraform init \
            -backend-config="bucket=${{ steps.backend.outputs.bucket }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            $migrate_flag

      - name: Apply
        run: terraform apply -auto-approve

  render-diagrams:
    name: Render PlantUML diagrams
    needs: terraform
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Install PlantUML
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq graphviz
          dot -V
          curl -fL -o plantuml.jar https://github.com/plantuml/plantuml/releases/download/v1.2026.8/plantuml-1.2026.8.jar
          file plantuml.jar
          java -version
          java -jar plantuml.jar -version

      - name: Render docs/*.puml to PNG
        run: |
          set -euo pipefail
          java -jar plantuml.jar -tpng -o . docs/*.puml

      - name: Commit and push the diagrams
        run: |
          set -euo pipefail
          git config user.name "repo-push-bot"
          git config user.email "repo-push-bot@users.noreply.github.com"
          if git diff --quiet -- docs && [ -z "$(git ls-files --others --exclude-standard -- docs)" ]; then
            echo 'diagrams unchanged' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git add -- docs
          git commit -m "docs: render PlantUML"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo 'rendered diagrams pushed' >> "$GITHUB_STEP_SUMMARY"
